[project]
name = "sequence_compression"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "evotorch>=0.6.1",
    "h5py>=3.16.0",
    "hdf5plugin>=7.0.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "ipywidgets>=8.1.9",
    "omegaconf>=2.3.1",
    "opencv-python-headless>=4.0.0",
    "pillow>=12.3.0",
    "pygame>=2.6.1",
    "pymunk>=7",
    "shapely>=2.1.2",
    "stable-worldmodel>=0.1.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.16.1",
    "wandb>=0.28.2",
]

[project.scripts]
train = "sequence_compression:train"
eval = "sequence_compression:eval"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
reportIndexIssue = "none"
