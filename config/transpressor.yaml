n_epochs: 100
lr: 1e-5
batch_size: 500
context_length: 4
log_to_wandb: False

transpressor:
  input_dim: 2
  hidden_dim: 64
  condition_dim: 2
  depth: 4
  heads: 4
  dim_head: 16
  mlp_dim: 128
  dropout: 0.1
  output_proj: True

ar_predictor:
  input_dim: 2
  hidden_dim: 64
  condition_dim: 2
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

pixel_preprocessor:
  model_name: "facebook/dinov2-small"

pixel_encoder:
  model_name: "facebook/dinov2-small"

datapath: "data/pusht_expert_train.h5"

device: "cpu"